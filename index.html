<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pal Trait Calculator — Palworld parents, offspring, trait paths, and owned-box planning."
    />
    <title>Pal Trait Calculator</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var key = "pal-trait-calculator.theme";
          var stored = localStorage.getItem(key);
          var theme =
            stored === "eidrolon" || stored === "sekhmet"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "sekhmet"
                : "eidrolon";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "eidrolon";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
